name: Renew webOS Dev Mode

# Keeps an LG TV's Developer Mode session alive so apps installed through it (like this one) are not removed
# when the session times out. Runs daily; only does something when the WEBOS_DEVMODE_TOKEN secret is set
# (store it with tools/devmode-secret.sh). The TV does not need to be on.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  renew:
    runs-on: ubuntu-24.04
    env:
      TOKEN: ${{ secrets.WEBOS_DEVMODE_TOKEN }}
    steps:
      - name: Renew session
        run: |
          if [[ -z "$TOKEN" ]]; then echo "WEBOS_DEVMODE_TOKEN is not set: nothing to renew."; exit 0; fi
          BASE=https://developer.lge.com/secure
          R="$(curl -fsS --retry 3 --max-time 30 "$BASE/ResetDevModeSession.dev?sessionToken=$TOKEN")"
          echo "renew: $R"
          grep -q '"result":"success"' <<<"$R" || { echo "::error::Renewal failed. Turn Dev Mode on again and refresh the token (tools/devmode-secret.sh)."; exit 1; }
          C="$(curl -fsS --retry 3 --max-time 30 "$BASE/CheckDevModeSession.dev?sessionToken=$TOKEN")"
          echo "remaining (h:m:s): $(sed -n 's/.*"errorMsg":"\([^"]*\)".*/\1/p' <<<"$C")"
